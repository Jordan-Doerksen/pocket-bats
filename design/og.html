<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Values copied from styles/night.tokens.css — this file renders once to og.png. */
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #070b1d;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    color: #eaedf8;
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(900px 620px at 50% -12%, #131a3a, transparent 70%);
  }
  .star { position: absolute; border-radius: 50%; background: #cdd6f4; opacity: 0.5; }
  .ring { position: absolute; border: 3px solid #9adcf0; border-radius: 50%; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 90px; }
  .label {
    font-family: system-ui, "Segoe UI", sans-serif;
    font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: #5aa8c4;
    margin: 0 0 22px;
  }
  h1 { font-size: 96px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; color: #ffe9b8; margin: 0 0 26px; }
  .sub { font-size: 30px; color: #aab2ce; margin: 0; max-width: 560px; line-height: 1.4; }
  svg { width: 400px; overflow: visible; flex: none; }
</style>
</head>
